name: icy snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#3a6b8c&color_dots=#eef7fb,#cfefff,#9be7ff,#5ad1ff,#2b8fbf
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2fbff&color_dots=#0e1a2b,#16405a,#2b8fbf,#5ad1ff,#9be7ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
